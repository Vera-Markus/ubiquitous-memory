# Builds a release from a version tag, on GitHub's Windows runner, so anyone with
# access can see the downloads were built from that tag's source.
#
#   git tag v1.0.0-rc1 && git push origin v1.0.0-rc1
#
# Tags with a hyphen (v1.0.0-rc1) are marked as pre-releases.
# "Run workflow" on the Actions tab builds without releasing (files under the run's Artifacts).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      # PyInstaller's ready-made bootloader (the program's start-up code) is shared by many
      # programs, including malware, so antivirus heuristics flag it: RC2 was reported as
      # Trojan:Win32/Wacatac.B!ml. Compiling our own, with the runner's C compiler, gives
      # the program its own fingerprint. The hash shows in the log, to compare between builds.
      - name: Build PyInstaller's bootloader from source
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $v = (Select-String -Path requirements-dev.txt -Pattern '^pyinstaller==(\S+)').Matches[0].Groups[1].Value
          python -m pip install --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$v"
          $boot = python -c "import PyInstaller, pathlib; print(pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe')"
          Get-FileHash $boot | Format-List

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Check the tag matches app/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path app/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v") -replace '-.*$', ''
          if ($tag -ne $version) { throw "Tag ${{ github.ref_name }} doesn't match app/version.py ($version)" }

      - name: Build
        run: python tools/build_release.py dist/release --require-installer

      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: dist/release/*

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ("${{ github.ref_name }}".Contains("-")) { $flags += "--prerelease" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release/*).FullName --title "${{ github.ref_name }}" --generate-notes @flags
